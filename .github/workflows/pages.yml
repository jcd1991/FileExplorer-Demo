name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Prepare demo frontend
        run: |
          mkdir -p _site
          cp -R TestProject/wwwroot/. _site/
          cp RenderDemo/frontend-deployment.js _site/js/deployment.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static browser
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
