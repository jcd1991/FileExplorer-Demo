name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test application
        run: dotnet test TestProject/TestProject.Tests/TestProject.Tests.csproj --configuration Release
      - name: Test demo proxy
        run: dotnet test RenderDemo/RateLimitProxy.Tests/RateLimitProxy.Tests.csproj --configuration Release

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static browser
        uses: actions/upload-pages-artifact@v4
        with:
          path: TestProject/wwwroot
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
