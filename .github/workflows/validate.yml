name: Validate application

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: TestProject
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TestProject/browser-tests/package-lock.json
      - name: Backend tests and recommended analyzers
        run: dotnet test TestProject.sln -c Release -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest-recommended -warnaserror
      - name: Demo proxy build
        run: dotnet build ../RenderDemo/RateLimitProxy/RateLimitProxy.csproj -c Release -warnaserror
      - name: Formatting
        run: dotnet format TestProject.sln --verify-no-changes --no-restore
      - name: Install lint dependencies
        run: npm ci
      - name: JavaScript lint
        run: npm run lint
      - name: CSS lint
        run: npx --yes --package stylelint@16.26.1 stylelint 'wwwroot/*.css'
      - name: Install browser test dependencies
        working-directory: TestProject/browser-tests
        run: npm ci
      - name: Install Chromium
        working-directory: TestProject/browser-tests
        run: npx playwright install --with-deps chromium
      - name: Browser regressions
        working-directory: TestProject/browser-tests
        run: npm test
